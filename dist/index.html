<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f1e9"><title>Три кувшина</title>
<style>
*{box-sizing:border-box} :root{font-family:system-ui,-apple-system,sans-serif;color:#192e39;background:#f5f1e9;font-synthesis:none} body{margin:0;min-height:100dvh;overscroll-behavior:none}button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}button:focus-visible{outline:3px solid #087a96;outline-offset:3px}.shell{max-width:760px;margin:auto;padding:max(14px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(20px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));min-height:100dvh;display:flex;flex-direction:column;gap:16px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-size:12px;font-weight:800;letter-spacing:.14em;color:#55737b;text-transform:uppercase}.top h1{font-size:clamp(22px,5vw,34px);letter-spacing:-.06em;margin:3px 0}.counter{display:flex;gap:14px;background:#fffaf2;border:1px solid #ded9cf;border-radius:17px;padding:9px 14px;text-align:center}.counter small{display:block;font-size:11px;color:#63747b;white-space:nowrap}.counter strong{font-size:25px;line-height:1.1;display:block;font-variant-numeric:tabular-nums}.goal{text-align:center;padding:12px 8px 0}.goal p{margin:4px 0;font-size:15px;color:#52666e}.goal h2{font-size:clamp(38px,10vw,68px);margin:0;color:#087e9d;letter-spacing:-.065em;line-height:1.08}.goal b{color:#192e39}.board{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:end;gap:3px;padding:10px 3px 12px;border-radius:22px;background:linear-gradient(#e8eff0 0%,#f1f1e9 76%,#d9b78c 76%,#e7c9a0 100%);border:1px solid #e1ddd4;touch-action:none;user-select:none;-webkit-user-select:none;min-height:240px}.jug{position:relative;border:2px solid transparent;border-radius:19px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;background:transparent;padding:5px 0;min-width:0;touch-action:none;color:#193b48;transition:background .18s,border-color .18s}.jug.selected{background:#d0ebee88;border-color:#1597aa}.jug.over{background:#b6ead780;border-color:#1c966f}.jug.blocked{background:#f4d6ce80;border-color:#bf6a51}.jug svg{width:100%;height:auto;overflow:visible;display:block;filter:drop-shadow(0 6px 3px #31535b22);pointer-events:none}.jug .amount{font-size:clamp(19px,5vw,30px);font-weight:850;letter-spacing:-.05em;line-height:1.2;background:#fffaf0e8;padding:2px 10px;border-radius:10px;font-variant-numeric:tabular-nums}.jug .capacity{font-size:12px;color:#4b514a;margin:3px 0 0;font-weight:650}.jug .target-mark{position:absolute;top:0;left:50%;transform:translateX(-50%);font-size:10px;font-weight:800;letter-spacing:.06em;color:#086f86;white-space:nowrap;background:#e9f7f7;border-radius:10px;padding:3px 6px}.water{transition:y .38s cubic-bezier(.2,.7,.3,1),height .38s cubic-bezier(.2,.7,.3,1)}.surface{transition:cy .38s cubic-bezier(.2,.7,.3,1)}.status{text-align:center;min-height:42px;font-size:14px;line-height:1.4;color:#53666e;display:flex;align-items:center;justify-content:center}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.actions button,.win button{padding:13px 5px;border:1px solid #d7d9d4;border-radius:13px;background:#fffdf7;color:#23414b;font-size:13px;font-weight:750}.actions button.primary,.win button.primary{background:#087e9d;border-color:#087e9d;color:white}.actions button:disabled{opacity:.43;cursor:default}.footer{font-size:11px;color:#64777c;text-align:center;line-height:1.45}.ghost{position:fixed;z-index:100;pointer-events:none;width:100px;height:130px;transform:translate(-50%,-65%) rotate(-18deg);opacity:.91;filter:drop-shadow(0 9px 9px #183f4350)}.ghost svg{width:100%;height:100%}.ghost .amount,.ghost .capacity,.ghost .target-mark{display:none}.stream{position:absolute;z-index:3;pointer-events:none;border-radius:50%;height:7px;transform-origin:left center;background:repeating-linear-gradient(90deg,#29bade 0 12px,#b1eff9 12px 19px);animation:flow .35s linear both}.win{border:1px solid #b7dcd5;background:#eaf7f1;border-radius:18px;padding:13px;text-align:center}.win h3{margin:0 0 4px;font-size:22px}.win p{margin:0 0 10px;font-size:14px}.win button{padding:10px 24px}.win[hidden]{display:none}@keyframes flow{0%{opacity:0;scale:.2 1}35%{opacity:1;scale:1 1}100%{opacity:0;scale:1 1}}@media(min-width:580px){.board{padding:10px 25px 15px}.jug svg{max-height:290px}.shell{gap:20px}}@media(max-height:520px) and (orientation:landscape){.shell{display:grid;grid-template-columns:1fr 1.65fr;gap:6px 12px;padding:8px 18px;min-height:100dvh;align-content:center}.top{grid-column:1/-1}.goal{grid-column:1;grid-row:2}.board{grid-column:2;grid-row:2/5;min-height:0;padding:1px 3px 4px}.jug svg{max-height:180px}.status{grid-column:1;min-height:28px}.actions{grid-column:1}.footer{grid-column:1/-1}.win{grid-column:1/-1}.goal h2{font-size:42px}.counter{padding:5px 10px}.top h1{font-size:22px}.jug .amount{font-size:19px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><main class="shell">
<header class="top"><div><div class="brand">Логическая игра</div><h1>Три кувшина</h1></div><div class="counter" aria-label="Счёт"><div><small>Ходы</small><strong id="moves">0</strong></div><div><small>Минимум</small><strong id="minimum">–</strong></div></div></header>
<section class="goal"><p>Оставь в большом кувшине ровно</p><h2 id="target">–</h2><p>Не выливая воду за пределы сосудов</p></section>
<section class="board" id="board" aria-label="Три кувшина"></section>
<div class="status" id="status" aria-live="polite">Перетащи кувшин на другой, чтобы перелить воду.</div>
<section class="win" id="win" hidden><h3 id="winTitle"></h3><p id="winText"></p><button class="primary" id="next">Следующая задача</button></section>
<div class="actions"><button id="reset">↺ Заново</button><button id="undo" disabled>↶ Отменить</button><button class="primary" id="new">Новая задача</button></div>
<div class="footer">Переливание идёт до заполнения второго кувшина или опустошения первого. Можно также выбрать два кувшина касаниями.</div>
</main><script src="engine.js"></script><script>
'use strict';const $=id=>document.getElementById(id);const board=$('board');let puzzle,state,moves=0,history=[],selected=null,drag=null,won=false,serial=0;const initialMessage='Перетащи кувшин на другой или коснись двух кувшинов по очереди.';
function jugArt(i){const c=puzzle.cap[i], ratio=state[i]/c;const h=85+145*Math.sqrt(c/puzzle.cap[0]),top=251-h,bottom=243,w=100+21*Math.sqrt(c/puzzle.cap[0]),left=13,right=left+w;const y=bottom-ratio*(bottom-top-9);const id='j'+serial+'-'+i;return `<svg viewBox="0 0 166 263" aria-hidden="true"><defs><clipPath id="${id}"><path d="M${left+9} ${top+7} L${right-8} ${top+7} L${right-8} ${bottom-9} Q${right-8} ${bottom} ${right-25} ${bottom} L${left+25} ${bottom} Q${left+10} ${bottom} ${left+9} ${bottom-10}Z"/></clipPath><linearGradient id="${id}w" x2="0" y2="1"><stop stop-color="#60dcf2"/><stop offset="1" stop-color="#149bc4"/></linearGradient></defs><path d="M${right-2} ${top+29} C${right+42} ${top+17} ${right+42} ${top+112} ${right-2} ${top+122}" stroke="#5c9baa" stroke-width="13" fill="none" stroke-linecap="round"/><path d="M${right-2} ${top+29} C${right+42} ${top+17} ${right+42} ${top+112} ${right-2} ${top+122}" stroke="#d8f5fa" stroke-width="7" fill="none" stroke-linecap="round"/><path d="M${left-7} ${top+1} Q${left+7} ${top+14} ${left+7} ${top+35} L${left+7} ${bottom-12} Q${left+7} ${bottom+8} ${left+32} ${bottom+8} L${right-28} ${bottom+8} Q${right} ${bottom+8} ${right} ${bottom-12} L${right} ${top+1} Z" fill="#d9f3fa" fill-opacity=".66" stroke="#4a8495" stroke-width="2.5"/><g clip-path="url(#${id})"><rect class="water" x="${left+5}" y="${y}" width="${w}" height="${bottom-y+1}" fill="url(#${id}w)"/><ellipse class="surface" cx="${(left+right)/2}" cy="${y}" rx="${(w-12)/2}" ry="5" fill="#b5f4f8" opacity="${ratio?'.85':'0'}"/><path d="M${left+20} ${top+18} V${bottom-22}" stroke="white" opacity=".65" stroke-width="7" stroke-linecap="round"/><path d="M${right-17} ${top+28} V${bottom-30}" stroke="white" opacity=".35" stroke-width="3" stroke-linecap="round"/>${i===0?`<path d="M${left+10} ${bottom-puzzle.target/c*(bottom-top-9)} H${right-10}" stroke="#086984" stroke-dasharray="4 5" opacity=".7"/>`:''}</g><ellipse cx="${(left+right)/2-3}" cy="${top+1}" rx="${w/2+3}" ry="9" fill="#e7f8fb" fill-opacity=".65" stroke="#4a8495" stroke-width="2.3"/></svg>`;}
function render(){serial++;board.innerHTML='';for(let i=0;i<3;i++){const b=document.createElement('button');b.type='button';b.className='jug'+(selected===i?' selected':'');b.dataset.i=i;b.setAttribute('aria-label',`Кувшин ${i+1}: ${state[i]} из ${puzzle.cap[i]} л`);b.setAttribute('aria-pressed',selected===i?'true':'false');b.innerHTML=(i===0?'<span class="target-mark">ЦЕЛЕВОЙ</span>':'')+jugArt(i)+`<span class="amount">${state[i]} л</span><span class="capacity">из ${puzzle.cap[i]} л</span>`;board.append(b);b.addEventListener('pointerdown',down);b.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();choose(i);}});}
$('moves').textContent=moves;$('minimum').textContent=puzzle.minimum;$('target').textContent=puzzle.target+' л';$('undo').disabled=!history.length;$('win').hidden=!won;}
function updateWater(){for(let i=0;i<3;i++){const el=board.children[i],c=puzzle.cap[i],top=251-(85+145*Math.sqrt(c/puzzle.cap[0])),y=243-state[i]/c*(243-top-9);el.querySelector('.water').setAttribute('y',y);el.querySelector('.water').setAttribute('height',243-y+1);el.querySelector('.surface').setAttribute('cy',y);el.querySelector('.surface').setAttribute('opacity',state[i]?'.85':'0');el.querySelector('.amount').textContent=state[i]+' л';el.setAttribute('aria-label',`Кувшин ${i+1}: ${state[i]} из ${c} л`);el.setAttribute('aria-pressed','false');el.classList.remove('selected','over','blocked');}$('moves').textContent=moves;$('undo').disabled=!history.length;}
function msg(t){$('status').textContent=t;}
function start(fresh){cleanup();if(fresh)puzzle=Jugs.generate(puzzle);state=puzzle.start.slice();moves=0;history=[];selected=null;won=false;render();msg(initialMessage);}
function attempt(a,b){if(won)return;const result=Jugs.pour(puzzle.cap,state,a,b);selected=null;if(!result){render();msg(state[a]===0?'Этот кувшин пуст.':'В этот кувшин больше не помещается вода.');return;}history.push(state.slice());state=result.state;moves++;updateWater();const x=board.children[a].getBoundingClientRect(),y=board.children[b].getBoundingClientRect(),z=board.getBoundingClientRect();const dx=(y.left+y.width/2)-(x.left+x.width/2),dy=(y.top-x.top)*.4;const stream=document.createElement('div');stream.className='stream';stream.style.cssText=`left:${x.left+x.width/2-z.left}px;top:${Math.min(x.top,y.top)-z.top+45}px;width:${Math.hypot(dx,dy)}px;transform:rotate(${Math.atan2(dy,dx)}rad)`;board.append(stream);setTimeout(()=>stream.remove(),390);msg(`Перелито ${result.amount} л.`);if(state[0]===puzzle.target){won=true;$('win').hidden=false;$('winTitle').textContent=moves===puzzle.minimum?'Идеальное решение!':'Задача решена!';$('winText').textContent=moves===puzzle.minimum?`Ты нашёл кратчайший путь за ${moves} ходов.`:`Твои ходы: ${moves}. Минимум: ${puzzle.minimum}.`;msg('В большом кувшине ровно '+puzzle.target+' л.');}}
function choose(i){if(won)return;if(selected===null){if(!state[i]){msg('Выбери кувшин, в котором есть вода.');return;}selected=i;render();msg('Теперь выбери, куда перелить воду.');}else if(selected===i){selected=null;render();msg(initialMessage);}else attempt(selected,i);}
function down(e){if(won||drag||e.button!==0)return;const i=Number(e.currentTarget.dataset.i);e.preventDefault();drag={i,id:e.pointerId,x:e.clientX,y:e.clientY,active:false,ghost:null};try{board.setPointerCapture(e.pointerId);}catch{}}
function under(x,y){const target=document.elementFromPoint(x,y)?.closest('.jug');return target&&board.contains(target)?Number(target.dataset.i):null;}
board.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id)return;if(!drag.active&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>9){drag.active=true;if(!state[drag.i])return;drag.ghost=document.createElement('div');drag.ghost.className='ghost';const source=board.children[drag.i].querySelector('svg').cloneNode(true);const ids=new Map();source.querySelectorAll('[id]').forEach(n=>{const old=n.id;n.id='ghost-'+old;ids.set(old,n.id);});source.querySelectorAll('*').forEach(n=>{for(const attr of ['fill','clip-path']){const v=n.getAttribute(attr);if(v?.startsWith('url(#')){const old=v.slice(5,-1);if(ids.has(old))n.setAttribute(attr,'url(#'+ids.get(old)+')');}}});drag.ghost.append(source);document.body.append(drag.ghost);selected=drag.i;}
 if(drag.ghost){drag.ghost.style.left=e.clientX+'px';drag.ghost.style.top=e.clientY+'px';const dest=under(e.clientX,e.clientY);for(let i=0;i<3;i++){const el=board.children[i];el.classList.toggle('selected',i===drag.i);el.classList.toggle('over',i===dest&&i!==drag.i&&state[i]<puzzle.cap[i]);el.classList.toggle('blocked',i===dest&&i!==drag.i&&state[i]===puzzle.cap[i]);}}});
function cleanup(){if(drag){const d=drag;drag=null;d.ghost?.remove();try{if(board.hasPointerCapture(d.id))board.releasePointerCapture(d.id);}catch{}}}
board.addEventListener('pointerup',e=>{if(!drag||e.pointerId!==drag.id)return;const {i,active}=drag,dest=under(e.clientX,e.clientY);cleanup();if(!active)choose(i);else if(dest!==null&&dest!==i)attempt(i,dest);else{selected=null;render();msg(initialMessage);}});function cancel(){if(drag){cleanup();selected=null;render();msg(initialMessage);}}board.addEventListener('pointercancel',cancel);board.addEventListener('lostpointercapture',cancel);
$('reset').onclick=()=>start(false);$('new').onclick=$('next').onclick=()=>start(true);$('undo').onclick=()=>{if(!history.length)return;cleanup();state=history.pop();moves--;won=false;selected=null;render();msg('Последний ход отменён.');};start(true);
</script></body></html>
